<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Wishes for Madina Iqbal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow"></div>
    <div id="confetti-layer"></div>

    <main class="card">
      <p class="eyebrow">A Special Birthday Surprise</p>
      <h1>Happy Birthday, Madina Iqbal! 🎉</h1>
      <p class="message">
        Wishing you a beautiful day filled with laughter, love, peace, and all the happiness your heart can hold.
        May this new year bring you endless joy, success, and unforgettable memories.
      </p>

      <div class="gift-box">
        <div class="gift-ribbon"></div>
        <div class="gift-bow"></div>
      </div>

      <div class="signature">
        <span>With love,</span>
        <strong>Arsalan Khan</strong>
      </div>

      <button id="wishButton" class="wish-button">Celebrate with a surprise</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
